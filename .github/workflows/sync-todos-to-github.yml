name: Sync Todos to GitHub Issues

on:
  workflow_dispatch:

jobs:
  create-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create GitHub issues from local todo list
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const todos = [
              {
                title: 'Recording hosting info',
                body: 'Record netcup hosting capabilities: FTP, SSH, Python 3.9.2 via passenger_wsgi.py, PHP 8.5, Node.js 26.7.0.',
                labels: ['task', 'pending']
              },
              {
                title: 'Initializing project on GitHub',
                body: 'Create repository, README, project board, enable Copilot, add LICENSE, .gitignore and initial branch protection rules.',
                labels: ['task', 'done']
              },
              {
                title: 'Scaffold Angular frontend',
                body: 'Use Angular CLI to scaffold app and create an ImageEditor component; include tooling for local dev in VS Code.',
                labels: ['task', 'pending']
              },
              {
                title: 'Scaffold backend (Node.js/TypeScript)',
                body: 'Create a minimal Express backend in TypeScript with endpoints for upload/save/get; store metadata in MySQL (netcup provided); store files on filesystem. Designed for netcup Node.js 26.x hosting.',
                labels: ['task', 'in progress']
              },
              {
                title: 'Implement client-side image editing',
                body: 'Implement upload, crop, select watermark (4 corners), preview, and produce final image in the browser using Canvas with ngx-image-cropper and optionally Fabric.js or Konva for redaction.',
                labels: ['task', 'pending']
              },
              {
                title: 'Implement server storage API',
                body: 'Endpoints to receive original image, JSON settings, and final image; store files in filesystem and metadata in MySQL; return IDs and URLs.',
                labels: ['task', 'pending']
              },
              {
                title: 'CI/CD and deployment',
                body: 'Configure GitHub Actions to build frontend, run tests, and deploy to netcup via SSH/rsync (or FTP fallback).',
                labels: ['task', 'pending']
              },
              {
                title: 'Test deployment on netcup',
                body: 'Deploy a demo build to the netcup account, verify passenger_wsgi and static file serving, and validate that uploads persist.',
                labels: ['task', 'pending']
              },
              {
                title: 'Developer docs and local setup',
                body: 'Write instructions for local VS Code development, environment setup, building, running and deploying.',
                labels: ['task', 'pending']
              },
              {
                title: 'Extended features roadmap',
                body: 'Add redact tool, grouping of images with text, and export/draft-post to Instagram/Facebook (investigate APIs and export formats).',
                labels: ['task', 'pending']
              }
            ];

            for (const todo of todos) {
              const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${todo.title}"`;
              const existing = await github.rest.search.issuesAndPullRequests({
                q: query,
                per_page: 1
              });

              if (existing.data.total_count > 0) {
                core.info(`Skipping existing issue: ${todo.title}`);
                continue;
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: todo.title,
                body: todo.body,
                labels: todo.labels
              });
              core.info(`Created issue: ${todo.title}`);
            }
