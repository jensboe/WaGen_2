<section class="page-shell">
  <header>
    <h2 i18n>Upload a New Image</h2>
    <p i18n>Select an image file, crop it, blur sensitive areas, and add a watermark before saving.</p>
  </header>

  <mat-tab-group [selectedIndex]="selectedTabIndex" (selectedIndexChange)="onTabChange($event)">
    <mat-tab>
      <ng-template mat-tab-label i18n>Upload</ng-template>
    </mat-tab>
    <mat-tab [disabled]="!selectedFile">
      <ng-template mat-tab-label i18n>Crop</ng-template>
    </mat-tab>
    <mat-tab [disabled]="!selectedFile">
      <ng-template mat-tab-label i18n>Blur areas</ng-template>
    </mat-tab>
  </mat-tab-group>

  <div class="file-selection" *ngIf="selectedTabIndex === 0">
    <label class="file-picker">
      <span i18n>Select image</span>
      <input type="file" accept="image/*" (change)="onFileSelected($event)" />
    </label>
  </div>

  <div *ngIf="selectedFile && selectedTabIndex > 0">
    <app-image-editor
      [sourceFile]="selectedFile"
      [showStepTabs]="false"
      [externalStep]="selectedTabIndex === 1 ? 'crop' : 'redact'"
      (save)="handleSave($event)">
    </app-image-editor>
  </div>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  <p *ngIf="successMessage" class="success">{{ successMessage }}</p>

  <div class="actions" *ngIf="selectedFile">
    <button type="button" (click)="resetSelection()" i18n>Choose another image</button>
    <a routerLink="/images" i18n>Cancel</a>
  </div>
</section>
