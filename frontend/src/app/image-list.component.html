<section class="page-shell">
  <header>
    <h2 i18n>Image Gallery</h2>
    <p i18n>Browse uploaded images and open them for editing.</p>
  </header>

  <div class="gallery-toolbar" *ngIf="images.length">
    <span i18n>Show</span>
    <mat-button-toggle-group [(ngModel)]="displayMode" aria-label="Image version" i18n-aria-label>
      <mat-button-toggle value="original" i18n>Original</mat-button-toggle>
      <mat-button-toggle value="final" i18n>Edited</mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <div *ngIf="images.length; else emptyState" class="image-list">
    <mat-card *ngFor="let image of images" class="image-card" appearance="outlined">
      <div class="image-preview" [class.missing-image]="!getDisplayUrl(image)">
        <img *ngIf="displayMode === 'original' && getDisplayUrl(image); else finalOrMissingImage" [src]="getDisplayUrl(image)!" alt="Original image" i18n-alt />
        <ng-template #finalOrMissingImage>
          <img *ngIf="getDisplayUrl(image); else missingImage" [src]="getDisplayUrl(image)!" alt="Final image" i18n />
        </ng-template>
        <ng-template #missingImage>
          <div class="missing-image-label" i18n>No final image yet</div>
        </ng-template>
      </div>
      <mat-card-actions align="end">
        <a mat-button color="primary" [routerLink]="['/images', image.id, 'edit']" i18n>Edit</a>
      </mat-card-actions>
    </mat-card>
  </div>

  <ng-template #emptyState>
    <mat-card class="empty-state" appearance="outlined">
       <p i18n>No images available yet. Upload a new image to get started.</p>
    </mat-card>
  </ng-template>

  <div class="actions">
    <a mat-flat-button color="primary" routerLink="/upload" i18n>Upload new image</a>
  </div>
</section>
