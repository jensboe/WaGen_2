<main class="app-shell">
  <mat-toolbar color="primary" class="app-header">
    <div class="logo">
      <h1>WaGen</h1>
      <span class="subtitle">Browser-based watermarking and image editing.</span>
    </div>

    <span class="spacer"></span>

    <a mat-button routerLink="/images" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Images</a>
    <a mat-button routerLink="/upload" routerLinkActive="active">Upload & edit</a>
  </mat-toolbar>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</main>
